# Conda env for the MMPA pipeline (matches the `mmp` environment used on the cluster).
# Create:  conda env create -f environment.yml
# Activate: conda activate mmp
name: mmp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdkit=2024.03.5
  - numpy
  - pandas
  - scipy
  - matplotlib
  - pillow
  - pip
  - pip:
      - mmpdb==2.1
